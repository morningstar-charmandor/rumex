appId: com.contextworkspace.app
productName: ContextWorkspace
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Utility
