appId: com.rumex.app
productName: Rumex
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: native/bin/RumexNotchHelper
    to: native/RumexNotchHelper
asar: true
npmRebuild: false
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Utility
